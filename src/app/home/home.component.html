<h1>Trendy Products</h1>
<div class = "row">
    <div class = "col-sm-3" >
        <div class ="product" *ngFor = " let product of trendy_productList">
            <img src = "{{product.imgUrl}}"/>
        <div class = "prodct-details">
            <div class ="name-product">
                    <h6>ProductName : {{product.productname}}</h6>
            </div>
            <div class ="product-price">
                <h6> ProductPrice: {{product.productprice}}</h6>         
            </div>
            <div class ="product-price">
                <h6> ProductColor: green</h6>         
            </div>
        </div>

        <div class = "footer">
            <a routerLink = "/product-detail/{{product.id}}"> View Details</a>
            <a href="">Add to Cart</a>
        </div>
    </div>
 
  
    </div>

</div>
